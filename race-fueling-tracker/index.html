<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f6fa" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9A%A1%3C/text%3E%3C/svg%3E" />
    <script>
      // Apply the saved theme before first paint (light by default).
      try { document.documentElement.dataset.theme = localStorage.getItem('race-fueling-tracker-theme') === 'dark' ? 'dark' : 'light'; }
      catch (e) { document.documentElement.dataset.theme = 'light'; }
    </script>
    <title>Race Fueling Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
